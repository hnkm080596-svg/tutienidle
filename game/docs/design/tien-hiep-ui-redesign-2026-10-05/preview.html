#322819;text-align:center;z-index:8}.grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px}.slot{aspect-ratio:1;background:#17201dee;border:0}.slot .glyph{width:55%;height:55%;filter:brightness(0) saturate(100%) invert(83%) sepia(30%) saturate(600%) hue-rotate(352deg);position:relative;z-index:1}.slot:hover{filter:brightness(1.14)}.slot.selected{outline:2px solid #ffcb59;box-shadow:0 0 14px #eac86488}.workspace{position:absolute;left:36%;top:25%;width:58%;height:58%;color:#302717;z-index:4;overflow:auto;padding:8px}.wideworkspace{left:15%;width:79%}.tabs{display:flex;gap:8px;margin-bottom:20px}.tabs .art{width:150px;height:40px;border:0;background:none}.tree{position:relative;height:430px;width:100%;background:radial-gradient(ellipse,#d6b87044,transparent 65%)}.tree svg{position:absolute;inset:0;width:100%;height:100%}.tree button{position:absolute;width:75px;height:75px;border:0;background:#132421;border-radius:50%;color:#ffe2a5}.tree button img{position:relative;width:30px;height:30px;filter:brightness(0) saturate(100%) invert(83%) sepia(30%) saturate(600%) hue-rotate(352deg)}.tree button.locked{filter:grayscale(1);opacity:.55}.tree .root{width:110px;height:110px}.home-figure{left:34%;top:33%;width:25%;height:47%;cursor:pointer}.wheel{position:absolute;left:27%;top:28%;width:40%;height:51%;display:none;z-index:5}.wheel.open{display:block}.wheel .art{position:absolute;width:94px;height:94px;border:0;background:#132020;border-radius:50%;color:#f1d69e;font-size:14px}.wheel img{filter:brightness(0) saturate(100%) invert(83%) sepia(30%) saturate(600%) hue-rotate(352deg);width:32px;height:32px;position:relative}.board{position:absolute;right:2%;top:16%;width:26%;height:36%;padding:30px;color:#332b1e;background:#f0e4c6;border-radius:5px;z-index:6}.board .content{width:100%}.board h2{margin:0 0 16px;font-size:26px}.board p{font-size:17px;margin:8px 0}.board .goldbutton{width:94px;height:35px;float:right}.location{position:absolute;bottom:5%;left:35%;width:30%;height:72px;font-size:31px;color:#eed9a5}.building{position:absolute;width:75px;height:165px;z-index:4;color:#ebd7af;border:0;background:none;line-height:1.4}.building .text{width:50px;text-align:center}.building img{display:block;width:28px;margin:0 auto 12px}.combatbar{position:absolute;left:5%;right:5%;bottom:5%;height:130px;padding:20px;display:flex;gap:20px;background:#0f1a18df;color:#f0ddae}.combatbar>.content{display:flex;gap:18px;align-items:center;width:100%}.combatbar .art{width:80px;height:80px;border:0;border-radius:50%;background:#10211b;color:#e8d3a8}.rows{display:grid;gap:12px}.rows .art{height:70px;padding:14px 24px;display:block}.rows .text{display:flex;justify-content:space-between;align-items:center;width:100%}.rows .goldbutton{height:40px;width:130px}.field{width:100%;height:48px;margin:15px 0}.field input{position:relative;background:transparent;border:0;width:75%;font:18px Georgia;color:#302717;outline:none}.gallery{padding:24px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{background:#20302b;border:1px solid #6d6549;border-radius:5px;overflow:hidden}.card h3{margin:0;padding:12px;font:15px Arial}.pair{display:grid;grid-template-columns:1fr 1fr}.swatch{height:150px;display:grid;place-items:center;position:relative;overflow:hidden}.swatch.light{background:#eee2c7}.swatch.dark{background:#13201e}.swatch>.art{width:90%;height:80%}.meta{padding:12px;font:12px/1.6 Arial;color:#c4c5b5}.state-line{display:flex;gap:8px;padding:10px;flex-wrap:wrap;font:12px Arial}.state-line span{padding:5px 7px;border:1px solid #8b743e}.state-line .locked{opacity:.5;filter:grayscale(1)}.controls{display:flex;gap:12px}.controls input{accent-color:#a58139}.muted{color:#827358}.toast{position:absolute;bottom:14%;left:38%;z-index:20;background:#192e23;color:#f7e8be;padding:14px;border:1px solid #bb9458;display:none}.responsive-note{display:none}@media(max-width:1000px){.gallery{grid-template-columns:repeat(2,1fr)}#scene{min-height:800px}. <header><strong>Tiên Hiệp — bản thiết kế và art bàn giao</strong><button data-view="character">Nhân Vật</button><button data-view="home">Động Phủ</button><button data-view="equipment">Trang Bị</button><button data-view="skill">Kỹ Năng</button><button data-view="function">Công trình</button><button data-view="combat">Chiến đấu</button><button data-view="settings">Cài Đặt</button><button data-view="gallery">Bộ art</button></header>
<div class="note">Bản thiết kế độc lập · Nhân vật động có sẵn · Dữ liệu ký hiệu “—” chờ model production · Chưa wiring vào game</div><main id="scene"></main><section id="gallery" class="gallery" hidden></section>
<script type="module">
const pack=await fetch('/assets/ui/tien-hiep-2026-10/pack.json').then(r=>r.json());const byId=Object.fromEntries(pack.assets.map(a=>[a.id,a]));const images={};await Promise.all(pack.assets.map(a=>new Promise((resolve,reject)=>{let im=new Image;im.onload=()=>{images[a.id]=im;resolve()};im.onerror=reject;im.src=a.url})));let view=new URL(location.href).searchParams.get('view')||'character';const scene=document.querySelector('#scene'),gallery=document.querySelector('#gallery');
const art=(id,cls='',text='')=>`<span class="art ${cls}" data-art="${id}"><canvas></canvas><span class="text">${text}</span></span>`;
const button=(text,disabled=false)=>`<button class="art goldbutton" data-art="button-primary" ${disabled?'disabled':''}><canvas></canvas><span class="text">${text}</span></button>`;
const names=['Nhân Vật','Cảnh Giới','Công Pháp','Kỹ Năng','Luyện Thể','Túi','Bản Đồ','Luyện Đan','Trang Bị','Nhiệm Vụ','Cài Đặt'];const keys=['character','realm','technique','skill','body','inventory','exploration','alchemy','equipment','quest','settings'];
const rail=()=>`<nav class="rail art" data-art="navigation-rail"><canvas></canvas><div class="rail-content">${names.map((n,i)=>`<button class="nav ${keys[i]===view?'active':''}" data-nav="${keys[i]}"><img src="/assets/ui/huyen-kim/symbols/${keys[i]}.svg" alt="">${n}</button>`).join('')}</div></nav>`;
const hud=()=>`<div class="hud">${['Linh Thạch','Linh Lực','Ý Lực'].map(n=>art('resource-pill','',n+' &nbsp; —')).join('')}${art('orb-frame','','⚙')}</div>`;
const settingsControl=n=>n==='Ngôn Ngữ'?'<select aria-label="Ngôn Ngữ"><option>Tiếng Việt</option><option>English</option></select>':n==='Tỷ Lệ UI'?'<select aria-label="Tỷ Lệ UI"><option>100%</option><option>125%</option><option>150%</option></select>':'<input type="range" aria-label="'+n+'" min="0" max="100" value="60">';
const section=t=>art('section-header','section',t);const rows=items=>items.map(n=>`<div class="statrow"><span>${n}</span><b>—</b></div>`).join('');
function shell(title){return `<div class="veil"></div><div class="paper art" data-art="page-frame"><canvas></canvas></div>${rail()}${art('title-plaque','plaque',title)}${hud()}`}
function animation(cls='figure'){return `<div class="${cls}" ${view==='home'?'role="button" tabindex="0" aria-label="Mở vòng chức năng"':''}><canvas class="hero" width="488" height="504"></canvas><small>Art động phap_tu_shared có sẵn — vùng hiển thị theo profile khi wiring</small></div>`}
let heroTimer;
async function animate(){clearInterval(heroTimer);const can=document.querySelector('.hero');if(!can)return;const atlas=await fetch('/assets/characters/animated/phap_tu_shared/phap_tu_shared-sheet-1.atlas.json').then(r=>r.json());const img=new Image;img.src='/assets/characters/animated/phap_tu_shared/phap_tu_shared-sheet-1.png';await img.decode();const frames=Object.entries(atlas.frames).filter(([k])=>k.startsWith('phap_tu_shared-idle-')).sort(([a],[b])=>a.localeCompare(b)).map(([,v])=>v);let index=0;const ctx=can.getContext('2d');function draw(){let f=frames[index++%frames.length],r=f.frame,s=f.spriteSourceSize;ctx.clearRect(0,0,can.width,can.height);const scale=Math.min(can.width/f.sourceSize.w,can.height/f.sourceSize.h);ctx.drawImage(img,r.x,r.y,r.w,r.h,s.x*scale,s.y*scale,r.w*scale,r.h*scale)}draw();if(!matchMedia('(prefers-reduced-motion: reduce)').matches)heroTimer=setInterval(draw,100)}
function drawArt(el){const a=byId[el.dataset.art],im=images[a.id],canvas=el.querySelector(':scope > canvas');if(!canvas)return;const w=el.clientWidth,h=el.clientHeight;if(!w||!h)return;canvas.width=w*devicePixelRatio;canvas.height=h*devicePixelRatio;const c=canvas.getContext('2d');c.scale(devicePixelRatio,devicePixelRatio);const r=a.sourceRect;
 if(a.render==='nine-slice-source-rect'){const s=a.slices;const dx=Math.min(a.destinationBorder,w/3),dy=Math.min(a.destinationBorder,h/3);const sx=[r.x,r.x+s.left,r.x+r.width-s.right,r.x+r.width],sy=[r.y,r.y+s.top,r.y+r.height-s.bottom,r.y+r.height];const tx=[0,dx,w-dx,w],ty=[0,dy,h-dy,h];for(let y=0;y<3;y++)for(let x=0;x<3;x++){if(x===1&&y===1&&a.center==='transparent')continue;c.drawImage(im,sx[x],sy[y],sx[x+1]-sx[x],sy[y+1]-sy[y],tx[x],ty[y],tx[x+1]-tx[x],ty[y+1]-ty[y])}}
 else if(a.render==='three-slice-source-rect'){const cap=r.width*a.capFraction,d=Math.min(w/3,h*r.width/r.height*a.capFraction);c.drawImage(im,r.x,r.y,cap,r.height,0,0,d+.5,h);c.drawImage(im,r.x+cap,r.y,r.width-2*cap,r.height,d-.5,0,w-2*d+1,h);c.drawImage(im,r.x+r.width-cap,r.y,cap,r.height,w-d-.5,0,d+.5,h)}
 else if(a.render==='tile'){c.drawImage(im,0,0,im.width,im.height,0,0,w,h)}else{const scale=Math.min(w/r.width,h/r.height),dw=r.width*scale,dh=r.height*scale;c.drawImage(im,r.x,r.y,r.width,r.height,(w-dw)/2,(h-dh)/2,dw,dh)}}
function renderArt(){document.querySelectorAll('.swatch .art').forEach(el=>{const a=byId[el.dataset.art];if(a.render==='three-slice-source-rect'){el.style.height=Math.min(90,el.clientWidth*a.sourceRect.height/a.sourceRect.width)+'px'}});document.querySelectorAll('[data-art]').forEach(drawArt)}
function render(){clearInterval(heroTimer);scene.hidden=view==='gallery';gallery.hidden=view!=='gallery';document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));gallery.innerHTML='';
 if(view==='gallery'){gallery.innerHTML=pack.assets.map(a=>`<article class="card"><h3>${a.id}</h3><div class="pair"><div class="swatch light">${art(a.id)}</div><div class="swatch dark">${art(a.id)}</div></div><div class="meta">${a.sourceSize.width}×${a.sourceSize.height} · ${a.render}<br>PNG · chữ/icon ghép riêng</div><div class="state-line"><span>Normal</span><span style="filter:brightness(1.08)">Hover</span><span style="outline:1px solid #e9bb5c">Selected</span><span class="locked">Locked</span></div></article>`).join('');scene.innerHTML='';renderArt();return;}
 if(view==='home'){scene.innerHTML=`${hud()}${animation('figure home-figure')}<div class="wheel">${['Nhân Vật','Kỹ Năng','Trang Bị','Luyện Thể','Bản Đồ','Cảnh Giới','Túi'].map((n,i)=>{let angle=(i/7)*Math.PI*2-Math.PI/2;return `<button class="art" data-art="orb-frame" style="left:${50+43*Math.cos(angle)}%;top:${50+39*Math.sin(angle)}%;transform:translate(-50%,-50%)"><canvas></canvas><span class="text"><img src="/assets/ui/huyen-kim/symbols/${["character","skill","equipment","body","exploration","realm","inventory"][i]}.svg" alt=""><br>${n}</span></button>`}).join('')}</div><aside class="board art" data-art="panel-frame"><canvas></canvas><div class="content"><h2>Thiên Cơ</h2>${['Đột phá cảnh giới','Nhiệm vụ đang theo dõi','Công trình sẵn sàng'].map(n=>`<p>${button('Đến')}${n}<br><small>Trạng thái từ read-model</small></p>`).join('')}</div></aside>${art('title-plaque','location','Động Phủ')}${[['Luyện Đan',19,20],['Luyện Khí',12,43],['Tụ Linh',4,65],['Thương Nhân',65,19],['Truyền Tống',80,60]].map(([n,x,y])=>`<button class="art building" data-art="building-plaque" style="left:${x}%;top:${y}%"><canvas></canvas><span class="text">${n}</span></button>`).join('')}`;const hero=scene.querySelector('.home-figure');hero.onclick=()=>{scene.querySelector('.wheel').classList.toggle('open');renderArt()};hero.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();hero.click()}};}
 else if(view==='character'){scene.innerHTML=shell('Nhân Vật')+`<div class="identity"><h2>Nhân Vật</h2><p>Tên · từ model<br>Cảnh giới · từ model<br>Đạo lộ · từ model</p><div class="art progress" data-art="progress-track"><canvas></canvas><i class="fill"></i></div>${art('power-ribbon','power','<span>Chiến Lực<br><strong>—</strong></span>')}</div>${animation()}<section class="statcol">${section('Thuộc Tính')}${rows(['Thể Chất','Sức Mạnh','Thân Pháp','Linh Lực','Thần Thức'])}${section('Thiên Phú')}<p>Danh sách từ nhân vật hiện tại</p>${section('Ngũ Hành')}${rows(['Kim','Mộc','Thủy','Hỏa','Thổ'])}</section><section class="details">${section('Chi Tiết')}${rows(['Tấn Công','Phòng Thủ','Sinh Lực','Bạo Kích','Kháng Bạo','Chính Xác','Né Tránh','Tốc Độ','Hồi Sinh Lực','Hồi Linh Lực'])}</section>`;}
 else if(view==='equipment'){scene.innerHTML=shell('Trang Bị')+`<div class="identity">${section('Trang Bị')}<p>Socket và số lượng từ model</p>${['Vũ khí','Áo','Trang sức'].map(n=>`${art('slot-frame','','<span>'+n+'</span>')}`).join('')}</div>${animation('figure')}<div class="workspace" style="left:59%;width:36%"><div class="tabs">${['Túi Đồ','Vật Phẩm','Nguyên Liệu'].map(n=>art('tab-plate','',n)).join('')}</div><div class="grid" style="grid-template-columns:repeat(5,1fr)">${Array.from({length:25},(_,i)=>`<button class="art slot ${i===2?'selected':''}" data-art="slot-frame" aria-label="Ô vật phẩm ${i+1}"><canvas></canvas>${i<8?'<img class="glyph" src="/assets/ui/huyen-kim/symbols/equipment.svg" alt="">':''}</button>`).join('')}</div><p>Dữ liệu vật phẩm thật được agent wiring đưa vào.</p>${button('Trang Bị',true)}<p class="muted">Lý do khóa hiển thị tại đây</p></div>`;}
 else if(view==='skill'){scene.innerHTML=shell('Kỹ Năng')+`<section class="workspace" style="left:15%;width:57%"><div class="tabs">${['Hỏa','Kim','Mộc','Thủy','Thổ'].map(n=>art('tab-plate','',n)).join('')}</div><div class="tree"><svg viewBox="0 0 800 430"><path d="M400 215L180 100L80 220L180 340L400 215L610 100L720 215L610 340L400 215L400 40" fill="none" stroke="#7e714f" stroke-width="3"/></svg>${[[50,50],[22,22],[10,51],[22,80],[76,22],[90,51],[76,80],[50,6]].map(([x,y],i)=>`<button class="art ${i===0?'root':''} ${i>4?'locked':''}" data-art="orb-frame" style="left:${x}%;top:${y}%;transform:translate(-50%,-50%)" ${i>4?'disabled':''}><canvas></canvas><img src="/assets/ui/huyen-kim/symbols/${i>4?'lock':'skill'}.svg" alt=""></button>`).join('')}</div><small>Sơ đồ mẫu bố cục; topology production giữ dữ liệu node thật.</small></section><section class="details">${section('Chiêu Thức')}<p>Tên, level và mô tả từ model.</p>${rows(['Hiệu quả hiện tại','Cấp kế','Điều kiện','Tiêu hao'])}${button('Nâng Cấp',true)}<p class="muted">Chưa đủ điều kiện — lý do từ owner</p></section>`;}
 else if(view==='combat'){scene.innerHTML=hud()+`<div style="position:absolute;left:5%;top:15%;width:240px;color:#f0dfbb">${art('identity-plate','','Đang chiến đấu')}${art('progress-track','progress','')}<p>HP/MP/turn từ combat model</p></div>${animation('figure')}<div class="art combatbar" data-art="panel-frame"><canvas></canvas><div class="content">${['Cơ Bản','Chiêu Thức','Khóa'].map((n,i)=>`<button class="art ${i===2?'locked':''}" data-art="orb-frame" ${i===2?'disabled':''}><canvas></canvas><span class="text">${n}</span></button>`).join('')}<span>Turn order · AI · Log<br><small>Giữ authoritative combat và timing hiện tại</small></span>${button('Rời Trận')}</div></div>`;}
 else if(view==='settings'){scene.innerHTML=shell('Cài Đặt')+`<section class="workspace wideworkspace">${section('Giao Diện & Âm Thanh')}<div class="rows">${['Ngôn Ngữ','Âm Lượng','Nhạc Nền','Tỷ Lệ UI'].map(n=>art('list-row','','<span>'+n+'</span><span class="controls">'+settingsControl(n)+'</span>')).join('')}</div>${section('Tài Khoản & Lưu Trữ')}${button('Xác Nhận')}<p>Hành động save/account thật giữ nguyên.</p></section>`;}
 else {scene.innerHTML=shell('Luyện Đan')+`<section class="workspace wideworkspace">${section('Công Thức')}<div class="rows">${['Danh sách công thức','Nguyên liệu và chi phí','Hàng đợi sản xuất'].map(n=>art('list-row','','<span>'+n+'</span>'+button('Chi Tiết'))).join('')}</div><div class="art field" data-art="text-field"><canvas></canvas><input placeholder="Tìm trong dữ liệu hiện có" aria-label="Bộ lọc mẫu"></div>${button('Bắt Đầu',true)}<p class="muted">Điều kiện thiếu luôn có vùng giải thích.</p></section>`;}
 scene.insertAdjacentHTML('beforeend','<div class="footnote">BẢN THIẾT KẾ UI · Art nhân vật tái sử dụng · Không có thay đổi gameplay</div><div class="toast">Tương tác mẫu — chờ wiring domain</div>');renderArt();animate();scene.querySelectorAll('.slot').forEach(b=>b.onclick=()=>{scene.querySelectorAll('.slot').forEach(s=>s.classList.remove('selected'));b.classList.add('selected')});scene.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{view=['character','skill','equipment','settings'].includes(b.dataset.nav)?b.dataset.nav:'function';render()});}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;history.replaceState(null,'','?view='+view);render()});addEventListener('resize',renderArt);render();window.previewReady=true;window.artManifest=pack;
</script></html>
