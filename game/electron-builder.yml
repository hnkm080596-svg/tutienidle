# Uncommitted audit followup plan, Ưu tiên 2 (Electron packaging,
# 2026-08-24) — file YAML thuần (không dùng key "build" trong package.json)
# để tránh mọi ràng buộc ESM/CJS: package.json là "type":"module", còn YAML
# không qua bất kỳ module loader JS nào.
appId: com.tienhiepidle.app
productName: Tien Hiep Idle

# BẮT BUỘC override — mặc định electron-builder là "dist", sẽ đè lên
# game/dist (output bản web build hiện có).
directories:
  output: release

# Chỉ đóng gói output đã build sẵn — không ship source TypeScript.
# '!node_modules/**/*' BẮT BUỘC: electron-builder có riêng
# nodeModuleFilePatterns mặc định '**/*' (đóng gói TOÀN BỘ node_modules cho
# app cần require() runtime deps), độc lập với 2 dòng trên — không loại trừ
# tường minh thì asar phình to vô ích (đã thấy thật: 127MB gồm @babel/vite/...).
# main.ts/preload.ts đã được vite-plugin-electron BUNDLE hết vào 1 file, chỉ
# còn import 'electron' (Electron runtime tự cấp, không cần node_modules).
files:
  - dist/**/*
  - dist-electron/**/*
  - '!node_modules/**/*'

win:
  target: nsis
  # No custom icon yet — electron-builder falls back to the default
  # Electron icon until a real build/icon.ico ships.

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

# BETA-FINAL PR12 / spec B6 - the update feed: GitHub Releases on this
# repo's own origin, 'beta' channel (prerelease-tagged builds only). This
# block generates resources/app-update.yml at pack time; the main-process
# UpdateService verifies that packaged manifest verbatim against
# EXPECTED_UPDATE_FEED in src/shared/update/UpdateState.ts - the two
# declarations are asserted equal by scripts/release/update-feed.test.mjs
# so they cannot drift apart silently.
# Minimal/additive on purpose: PR10 owns the wider release-workflow
# provider config on the parallel chain - expect a small merge conflict
# here rather than re-implementing it. No token lives in this file:
# publishing reads CI's GH_TOKEN env; the installer never bakes one in.
# publisherName stays unset while EXT-02 (signing) is pending - the
# packaged manifest declaring none is exactly what the pinned expectation
# (publisherName: null) accepts.
publish:
  provider: github
  owner: hnkm080596-svg
  repo: tutienidle
  channel: beta
