<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<style>
  :root {
    --rc-1:#8a877e; --rc-2:#d8d5cc; --rc-3:#6fbf73; --rc-4:#33d9d9;
    --rc-5:#5b9bd5; --rc-6:#9b7de3; --rc-7:#ffd54f; --rc-8:#ff6b4a;
    --rc-9:#e02b2b; --rc-10:#ffe9a8;
    /* Chất ramp (theme --grade-*): hoang/huyen/dia/thien/tien = rank 1/3/5/7/9 */
    --grade-hoang: var(--rc-1); --grade-huyen: var(--rc-3); --grade-dia: var(--rc-5);
    --grade-thien: var(--rc-7); --grade-tien: var(--rc-9);
    --grad-10: linear-gradient(90deg, #fff6d8, #ffe9a8, #ffd66b, #ff6b6b, #9e8cff, #67d8ff, #fff6d8);
  }
  body { background:#241b12; color:#e8d5a3; font-family:serif; padding:24px; }
  h2 { color:#ffd54f; font-size:20px; margin:18px 0 6px; }
  .note { color:#b8a578; font-size:12px; margin-bottom:12px; }
  .row { display:flex; gap:13px; align-items:flex-end; flex-wrap:wrap; }
  .cell { width:60px; height:60px; background:url('/assets/ui/tien-hiep-2026-10/controls/item-slot-v1.png') center/100% 100% no-repeat;
          display:flex; align-items:center; justify-content:center; position:relative; }
  .cell img { width:42px; height:42px; object-fit:contain; }
  .lv { position:absolute; bottom:-19px; left:0; right:0; text-align:center; font-size:11px; color:#cbb27a; }

  /* x1: viền tĩnh màu cảnh, KHÔNG pulse */
  .rim1 img { filter:drop-shadow(0 0 3px var(--c)); }
  .rim2 img { filter:drop-shadow(0 0 4px var(--c)) drop-shadow(0 0 8px color-mix(in srgb,var(--c) 55%,transparent)); }

  /* 3 band aura (x2+): band1 x2-4 thin slow, band2 x5-7 double, band3 x8-10 triple fast */
  .a1 img { animation:g1 3s ease-in-out infinite; }
  .a2 img { animation:g2 2s ease-in-out infinite; }
  .a3 img { animation:g3 1.2s ease-in-out infinite; }
  @keyframes g1 { 0%,100%{filter:drop-shadow(0 0 2.5px var(--c)) drop-shadow(0 0 5px color-mix(in srgb,var(--c) 60%,transparent))} 50%{filter:drop-shadow(0 0 4px var(--c)) drop-shadow(0 0 8px color-mix(in srgb,var(--c) 70%,transparent))} }
  @keyframes g2 { 0%,100%{filter:drop-shadow(0 0 3px var(--c)) drop-shadow(0 0 8px color-mix(in srgb,var(--c) 75%,transparent)) drop-shadow(0 0 14px color-mix(in srgb,var(--c) 40%,transparent))} 50%{filter:drop-shadow(0 0 5px var(--c)) drop-shadow(0 0 12px color-mix(in srgb,var(--c) 85%,transparent)) drop-shadow(0 0 20px color-mix(in srgb,var(--c) 55%,transparent))} }
  @keyframes g3 { 0%,100%{filter:drop-shadow(0 0 4px var(--c)) drop-shadow(0 0 10px var(--c)) drop-shadow(0 0 18px color-mix(in srgb,var(--c) 70%,transparent))} 50%{filter:drop-shadow(0 0 7px var(--c)) drop-shadow(0 0 16px var(--c)) drop-shadow(0 0 28px color-mix(in srgb,var(--c) 85%,transparent))} }

  /* realm colors: cảnh1 xám +1..+10, cảnh2 bạc +11..+20 */
  .r1{--c:var(--rc-1)} .r2{--c:var(--rc-2)}

  /* ===== Ô vát góc (chamfer square) =====
     Line sáng = frame clip-path evenodd: đa giác ngoài (vuông vát) +
     đa giác trong (trừ ruột) -> chỉ còn gờ vát. */
  .chamfer-cell {
    position: relative; width: 60px; height: 60px;
    display:flex; align-items:center; justify-content:center;
    clip-path: polygon(9px 0, calc(100% - 9px) 0, 100% 9px, 100% calc(100% - 9px), calc(100% - 9px) 100%, 9px 100%, 0 calc(100% - 9px), 0 9px);
    background: #16100a;
  }
  .chamfer-cell::before {
    content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
    background: linear-gradient(135deg, #e8c56a, #7a5a22 45%, #e8c56a);
    clip-path: polygon(evenodd,
      9px 0, calc(100% - 9px) 0, 100% 9px, 100% calc(100% - 9px), calc(100% - 9px) 100%, 9px 100%, 0 calc(100% - 9px), 0 9px,
      11px 2px, calc(100% - 11px) 2px, calc(100% - 2px) 11px, calc(100% - 2px) calc(100% - 11px), calc(100% - 11px) calc(100% - 2px), 11px calc(100% - 2px), 2px calc(100% - 11px), 2px 11px);
  }
  .chamfer-cell img { width:42px; height:42px; object-fit:contain; z-index:0; }
  /* glow quanh cạnh vát: drop-shadow bám đúng hình đã clip */
  .chamfer-glow { filter: drop-shadow(0 0 6px rgba(232,197,106,.55)); }
  .chamfer-pulse { animation: chamfer-p 2s ease-in-out infinite; }
  @keyframes chamfer-p { 0%,100%{filter:drop-shadow(0 0 4px rgba(232,197,106,.4))} 50%{filter:drop-shadow(0 0 9px rgba(255,214,110,.8))} }
  /* vát sâu hơn (gần bát giác) */
  .chamfer-deep {
    clip-path: polygon(16px 0, calc(100% - 16px) 0, 100% 16px, 100% calc(100% - 16px), calc(100% - 16px) 100%, 16px 100%, 0 calc(100% - 16px), 0 16px);
  }
  .chamfer-deep::before {
    clip-path: polygon(evenodd,
      16px 0, calc(100% - 16px) 0, 100% 16px, 100% calc(100% - 16px), calc(100% - 16px) 100%, 16px 100%, 0 calc(100% - 16px), 0 16px,
      18px 2px, calc(100% - 18px) 2px, calc(100% - 2px) 18px, calc(100% - 2px) calc(100% - 18px), calc(100% - 18px) calc(100% - 2px), 18px calc(100% - 2px), 2px calc(100% - 18px), 2px 18px);
  }

  /* ===== Sao băng: điểm sáng chạy quanh gờ vát =====
     conic-gradient(from --meteor) xoay -> vệt sáng ~90deg quét quanh
     khung evenodd. @property --meteor để keyframes được phép animate. */
  @property --meteor { syntax:'<angle>'; inherits:false; initial-value:0deg; }
  .meteor::before {
    background: conic-gradient(from var(--meteor),
      #ffd54f00 0deg, #ffd54f00 285deg,
      #ffe9a8 330deg, #fff8dc 344deg, #ffd54f 355deg, #ffd54f00 360deg);
    animation: meteor-run 3.5s linear infinite;
  }
  .meteor-fast::before { animation-duration: 1.8s; }
  .meteor-tail::before {
    background: conic-gradient(from var(--meteor),
      #ffd54f00 0deg, #ffd54f00 210deg,
      #c9963c55 260deg, #e8c56aaa 300deg,
      #ffe9a8 330deg, #fff8dc 344deg, #ffd54f 355deg, #ffd54f00 360deg);
    animation: meteor-run 3s linear infinite;
  }
  @keyframes meteor-run { to { --meteor: 360deg; } }

  /* ===== Phẩm recolor 10 bậc — nền phẩm sau icon (kênh ruột ô) ===== */
  .pcell { position:relative; width:60px; height:60px;
    background:url('/assets/ui/tien-hiep-2026-10/controls/item-slot-v2.png') center/cover no-repeat;
    display:flex; align-items:center; justify-content:center; }
  /* wash nằm TRÊN art nhưng chỉ phủ ruột; screen để tối->màu, icon nằm trên nó */
  .pcell .wash { position:absolute; inset:9%; border-radius:6px; pointer-events:none;
    background: radial-gradient(circle at 50% 55%,
      color-mix(in srgb, var(--qc) 78%, transparent) 0%,
      color-mix(in srgb, var(--qc) 55%, transparent) 45%,
      color-mix(in srgb, var(--qc) 30%, transparent) 72%,
      transparent 92%);
    opacity:.9; }
  .pcell.q10 .wash {
    background: radial-gradient(circle at 50% 55%,
      rgba(255,233,168,.85) 0%, rgba(255,107,107,.55) 30%,
      rgba(158,140,255,.45) 55%, rgba(103,216,255,.35) 75%, transparent 92%);
  }
  /* bản "plate" phẳng hơn cho so sánh (hàng dưới) */
  .pcell.flat .wash { background: color-mix(in srgb, var(--qc) 38%, transparent); inset:13%; }
  /* bản mỏng cho kết hợp aura: wash chỉ ~45% để drop-shadow icon đọc rõ */
  .pcell.thin .wash { background: radial-gradient(circle at 50% 55%,
      color-mix(in srgb, var(--qc) 45%, transparent) 0%,
      color-mix(in srgb, var(--qc) 28%, transparent) 55%,
      transparent 88%); }
  .pcell img { width:40px; height:40px; object-fit:contain; position:relative; }
  /* sao băng giả lập quanh ô cho phần kết hợp */
  .meteor-cell::before { content:''; position:absolute; inset:0; z-index:2; pointer-events:none;
    background: conic-gradient(from var(--meteor),
      #ffd54f00 0deg, #ffd54f00 285deg, #ffe9a8 330deg, #fff8dc 344deg, #ffd54f 355deg, #ffd54f00 360deg);
    clip-path: polygon(evenodd, 0 0, 100% 0, 100% 100%, 0 100%, 4% 4%, 96% 4%, 96% 96%, 4% 96%);
    animation: meteor-run 3s linear infinite; }
  /* Phương án D: tint mask theo ĐÚNG pixel hoa văn (mask PNG tách từ art) */
  .pcell.omask .tint2 { position:absolute; inset:0; background:var(--qc); pointer-events:none;
    -webkit-mask-image:url('/assets/ui/tien-hiep-2026-10/controls/item-slot-v2-ornament-mask.png');
    mask-image:url('/assets/ui/tien-hiep-2026-10/controls/item-slot-v2-ornament-mask.png');
    -webkit-mask-size:cover; mask-size:cover; -webkit-mask-position:center; mask-position:center;
    mix-blend-mode:color; opacity:.9; }
  /* lớp sáng: overlay nâng luminance + drop-shadow glow quanh nét */
  .pcell.omask .tint3 { position:absolute; inset:0; background:var(--qc); pointer-events:none;
    -webkit-mask-image:url('/assets/ui/tien-hiep-2026-10/controls/item-slot-v2-ornament-mask.png');
    mask-image:url('/assets/ui/tien-hiep-2026-10/controls/item-slot-v2-ornament-mask.png');
    -webkit-mask-size:cover; mask-size:cover; -webkit-mask-position:center; mask-position:center;
    mix-blend-mode:overlay; opacity:.85;
    filter: drop-shadow(0 0 1.5px var(--qc)) saturate(1.35) brightness(1.25); }
  .pcell.omask.q10 .tint3 { filter: drop-shadow(0 0 2px #ffd66b) saturate(1.3) brightness(1.3); }
  /* sweep: vệt sáng trắng quét ngang, mask theo hoa văn -> chỉ lướt trên nét */
  .pcell.omask .sweep { position:absolute; inset:0; pointer-events:none; opacity:.9;
    background: linear-gradient(105deg,
      transparent 38%, rgba(255,255,255,.05) 44%,
      rgba(255,255,255,.95) 50%, rgba(255,255,255,.05) 56%, transparent 62%);
    background-size: 300% 100%; background-repeat: no-repeat;
    -webkit-mask-image:url('/assets/ui/tien-hiep-2026-10/controls/item-slot-v2-ornament-mask.png');
    mask-image:url('/assets/ui/tien-hiep-2026-10/controls/item-slot-v2-ornament-mask.png');
    -webkit-mask-size:cover; mask-size:cover; -webkit-mask-position:center; mask-position:center;
    mix-blend-mode:screen;
    animation: orn-sweep 5s ease-in-out infinite; }
  /* bản chậm + hiếm hơn cho bậc thấp */
  .pcell.omask.slow .sweep { animation-duration: 7s; opacity:.7; }
  @keyframes orn-sweep { 0% { background-position: 130% 0; } 100% { background-position: -130% 0; } }
  /* P10: sweep thành dải cầu vồng hẹp */
  .pcell.omask.rainbow-sweep .sweep {
    background: linear-gradient(105deg,
      transparent 40%, rgba(255,107,107,.85) 46%, rgba(255,214,107,.9) 49%,
      rgba(103,216,255,.9) 52%, rgba(158,140,255,.85) 55%, transparent 61%);
    background-size: 300% 100%; animation-duration: 3.5s; }
  /* P10 cầu vồng ĐỘNG: hue-rotate toàn cụm tint -> màu chảy liên tục trên hoa văn */
  .pcell.omask.q10 .tint3, .pcell.omask.q10 .sweep {
    animation: hue-flow 3s linear infinite; }
  .pcell.omask.q10 .tint2 { animation: hue-flow-flat 5s linear infinite; }
  .pcell.omask.q10 .sweep { animation: orn-sweep 2.2s ease-in-out infinite, hue-flow 3s linear infinite; }
  @keyframes hue-flow { to { filter: hue-rotate(360deg) drop-shadow(0 0 2px #ffd66b) saturate(1.3) brightness(1.3); } }
  @keyframes hue-flow-flat { to { filter: hue-rotate(360deg); } }

  /* ===== Chất: sao băng quanh khung ô, 5 bậc (vệt dày/sáng/đuôi dài dần) =====
     Conic xoay + clip evenodd -> chỉ chạy trên gờ ô, không đụng hoa văn tint. */
  .pcell::before, .pcell::after { z-index:3; }
  .pcell.chat1::before { content:''; position:absolute; inset:0; pointer-events:none;
    --cc: var(--grade-hoang);
    background: conic-gradient(from var(--meteor),
      #ffe9a800 0deg, color-mix(in srgb, var(--cc) 0%, transparent) 320deg, color-mix(in srgb, var(--cc) 70%, transparent) 348deg, #fff8dcee 356deg, color-mix(in srgb, var(--cc) 0%, transparent) 360deg);
    clip-path: polygon(evenodd,
      10.4% 3.4%, 89.6% 3.4%, 96.6% 10.4%, 96.6% 89.6%, 89.6% 96.6%, 10.4% 96.6%, 3.4% 89.6%, 3.4% 10.4%,
      11.1% 5%, 88.9% 5%, 95% 11.1%, 95% 88.9%, 88.9% 95%, 11.1% 95%, 5% 88.9%, 5% 11.1%);
    animation: meteor-run 4s linear infinite; }
  .pcell.chat2::before { content:''; position:absolute; inset:0; pointer-events:none;
    --cc: var(--grade-huyen);
    background: conic-gradient(from var(--meteor),
      #ffe9a800 0deg, color-mix(in srgb, var(--cc) 0%, transparent) 300deg, color-mix(in srgb, var(--cc) 75%, transparent) 340deg, #fff8dc 354deg, color-mix(in srgb, var(--cc) 0%, transparent) 360deg);
    clip-path: polygon(evenodd,
      10.4% 3.4%, 89.6% 3.4%, 96.6% 10.4%, 96.6% 89.6%, 89.6% 96.6%, 10.4% 96.6%, 3.4% 89.6%, 3.4% 10.4%,
      11.1% 5%, 88.9% 5%, 95% 11.1%, 95% 88.9%, 88.9% 95%, 11.1% 95%, 5% 88.9%, 5% 11.1%);
    animation: meteor-run 3.4s linear infinite; }
  .pcell.chat3::before { content:''; position:absolute; inset:0; pointer-events:none;
    --cc: var(--grade-dia);
    background: conic-gradient(from var(--meteor),
      #ffe9a800 0deg, color-mix(in srgb, var(--cc) 0%, transparent) 265deg, color-mix(in srgb, var(--cc) 45%, transparent) 305deg, color-mix(in srgb, var(--cc) 80%, transparent) 340deg, #fff8dc 354deg, color-mix(in srgb, var(--cc) 0%, transparent) 360deg);
    clip-path: polygon(evenodd,
      10.4% 3.4%, 89.6% 3.4%, 96.6% 10.4%, 96.6% 89.6%, 89.6% 96.6%, 10.4% 96.6%, 3.4% 89.6%, 3.4% 10.4%,
      11.1% 5%, 88.9% 5%, 95% 11.1%, 95% 88.9%, 88.9% 95%, 11.1% 95%, 5% 88.9%, 5% 11.1%);
    animation: meteor-run 2.8s linear infinite; }
  .pcell.chat4::before { content:''; position:absolute; inset:0; pointer-events:none;
    --cc: var(--grade-thien);
    background: conic-gradient(from var(--meteor),
      #ffe9a800 0deg, color-mix(in srgb, var(--cc) 0%, transparent) 235deg, color-mix(in srgb, var(--cc) 40%, transparent) 280deg, color-mix(in srgb, var(--cc) 65%, transparent) 320deg, color-mix(in srgb, var(--cc) 85%, transparent) 344deg, #fff8dc 355deg, color-mix(in srgb, var(--cc) 0%, transparent) 360deg);
    clip-path: polygon(evenodd,
      10.4% 3.4%, 89.6% 3.4%, 96.6% 10.4%, 96.6% 89.6%, 89.6% 96.6%, 10.4% 96.6%, 3.4% 89.6%, 3.4% 10.4%,
      11.1% 5%, 88.9% 5%, 95% 11.1%, 95% 88.9%, 88.9% 95%, 11.1% 95%, 5% 88.9%, 5% 11.1%);
    animation: meteor-run 2.3s linear infinite;
    filter: drop-shadow(0 0 2px color-mix(in srgb, var(--cc) 75%, transparent)); }
  .pcell.chat5::before { content:''; position:absolute; inset:0; pointer-events:none;
    --cc: var(--grade-tien);
    background: conic-gradient(from var(--meteor),
      #ffe9a800 0deg, color-mix(in srgb, var(--cc) 0%, transparent) 30deg, color-mix(in srgb, var(--cc) 40%, transparent) 80deg, color-mix(in srgb, var(--cc) 70%, transparent) 120deg, color-mix(in srgb, var(--cc) 90%, transparent) 160deg, #fff8dc 172deg, color-mix(in srgb, var(--cc) 0%, transparent) 185deg,
      color-mix(in srgb, var(--cc) 0%, transparent) 210deg, color-mix(in srgb, var(--cc) 40%, transparent) 260deg, color-mix(in srgb, var(--cc) 70%, transparent) 300deg, color-mix(in srgb, var(--cc) 90%, transparent) 340deg, #fff8dc 352deg, color-mix(in srgb, var(--cc) 0%, transparent) 360deg);
    clip-path: polygon(evenodd,
      10.4% 3.4%, 89.6% 3.4%, 96.6% 10.4%, 96.6% 89.6%, 89.6% 96.6%, 10.4% 96.6%, 3.4% 89.6%, 3.4% 10.4%,
      11.1% 5%, 88.9% 5%, 95% 11.1%, 95% 88.9%, 88.9% 95%, 11.1% 95%, 5% 88.9%, 5% 11.1%);
    animation: meteor-run 1.8s linear infinite;
    filter: drop-shadow(0 0 3px color-mix(in srgb, var(--cc) 85%, transparent)); }

  /* ===== Kênh viền Chất — hiệu ứng thay thế sao băng ===== */
  /* Quỹ đạo khe bát giác: path chung cho animateMotion (viewBox 0 0 100 100) */
  .pcell svg.fx { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:3; }
  /* phù văn: chữ nhỏ quay quanh khe, màu grade, glow nhẹ */
  .pcell svg.fx text { font-size:7px; fill:var(--cc,#ffd54f); font-weight:700;
    text-anchor:middle; dominant-baseline:central;
    filter:drop-shadow(0 0 1.5px var(--cc,#ffd54f)); }
  /* tia lửa: chấm sáng trôi quanh khe */
  .pcell svg.fx circle { fill:#fff8dc; filter:drop-shadow(0 0 2px var(--cc,#ffd54f)) drop-shadow(0 0 4px var(--cc,#ffd54f)); }
  /* sấm: polyline gãy khúc dọc khe, nhấp nháy ngẫu nhiên */
  .pcell svg.fx polyline { fill:none; stroke:#fff8dc; stroke-width:1.6; stroke-linecap:round;
    filter:drop-shadow(0 0 2px var(--cc,#ffd54f)) drop-shadow(0 0 4px var(--cc,#ffd54f)); }
  .bolt1 { animation: bolt-flick 2.6s steps(1) infinite; }
  .bolt2 { animation: bolt-flick 3.1s steps(1) infinite .9s; }
  .bolt3 { animation: bolt-flick 2.2s steps(1) infinite 1.6s; }
  @keyframes bolt-flick { 0%,100%{opacity:0} 4%{opacity:1} 7%{opacity:.25} 9%{opacity:1} 13%{opacity:0} 47%{opacity:0} 49%{opacity:1} 51%{opacity:.3} 53%{opacity:0} }
  /* sấm theo cấp: C1 hiếm+mảnh -> C5 dày+rực+nhiều tia; tần suất qua dur */
  .bolt-s1 { stroke-width:1; animation: bolt-flick 3.6s steps(1) infinite; }
  .bolt-s2 { stroke-width:1.3; animation: bolt-flick 3s steps(1) infinite .8s; }
  .bolt-s3 { stroke-width:1.6; animation: bolt-flick 2.5s steps(1) infinite .4s; }
  .bolt-s4 { stroke-width:1.9; animation: bolt-flick 2.1s steps(1) infinite 1.1s; }
  .bolt-s5 { stroke-width:2.2; animation: bolt-flick 1.8s steps(1) infinite .6s; }

  /* song băng viền: 2 vệt conic đối xứng 180°, band = bề dày khung 0.8->5% */
  .pcell.chat-edge::before { content:''; position:absolute; inset:0; z-index:3; pointer-events:none;
    background: conic-gradient(from var(--meteor, 0deg),
      transparent 0deg, transparent 18deg,
      color-mix(in srgb, var(--cc) 55%, transparent) 44deg,
      color-mix(in srgb, var(--cc) 85%, #fff) 52deg, #fff8dc 56deg,
      transparent 66deg, transparent 198deg,
      color-mix(in srgb, var(--cc) 55%, transparent) 224deg,
      color-mix(in srgb, var(--cc) 85%, #fff) 232deg, #fff8dc 236deg,
      transparent 246deg, transparent 360deg);
    clip-path: polygon(evenodd,
      9% .8%, 91% .8%, 99.2% 9%, 99.2% 91%, 91% 99.2%, 9% 99.2%, .8% 91%, .8% 9%,
      11.1% 5%, 88.9% 5%, 95% 11.1%, 95% 88.9%, 88.9% 95%, 11.1% 95%, 5% 88.9%, 5% 11.1%);
    animation: meteor-run 4s linear infinite;
    filter: drop-shadow(0 0 4px color-mix(in srgb, var(--cc) 90%, transparent)) drop-shadow(0 0 2px var(--cc)); }

  /* gương: trắng gương bám bát giác — kênh "có đồ" của ô equipment */
  .pcell.mirror::before { content:''; position:absolute; inset:0; z-index:3; pointer-events:none;
    background: conic-gradient(from var(--meteor, 210deg),
      transparent 0deg, transparent 40deg,
      rgba(255,255,255,.16) 60deg, rgba(255,255,255,.5) 75deg, rgba(255,255,255,.16) 90deg,
      transparent 110deg, transparent 220deg,
      rgba(255,255,255,.16) 240deg, rgba(255,255,255,.5) 255deg, rgba(255,255,255,.16) 270deg,
      transparent 290deg, transparent 360deg);
    clip-path: polygon(evenodd,
      10.4% 3.4%, 89.6% 3.4%, 96.6% 10.4%, 96.6% 89.6%, 89.6% 96.6%, 10.4% 96.6%, 3.4% 89.6%, 3.4% 10.4%,
      11.1% 5%, 88.9% 5%, 95% 11.1%, 95% 88.9%, 88.9% 95%, 11.1% 95%, 5% 88.9%, 5% 11.1%);
    filter: drop-shadow(0 0 2.5px rgba(255,255,255,.65));
    animation: mirror-drift 9s linear infinite; }
  @keyframes mirror-drift { from { filter: drop-shadow(0 0 2.5px rgba(255,255,255,.65)) hue-rotate(0deg); } to { filter: drop-shadow(0 0 2.5px rgba(255,255,255,.65)) hue-rotate(360deg); } }
  /* sheen xoay chậm: dùng --meteor rotate thay hue để giữ trắng gương */
  .pcell.mirror::before { animation: meteor-run 20s linear infinite; }

  /* song băng: 2 đầu sáng đối xứng 180° trong khe */
  .pcell.chat-twin::before { content:''; position:absolute; inset:0; z-index:3; pointer-events:none;
    background: conic-gradient(from var(--meteor, 0deg),
      transparent 0deg, transparent 20deg,
      color-mix(in srgb, var(--cc) 55%, transparent) 48deg,
      color-mix(in srgb, var(--cc) 85%, #fff) 56deg, #fff8dc 60deg,
      transparent 70deg, transparent 200deg,
      color-mix(in srgb, var(--cc) 55%, transparent) 228deg,
      color-mix(in srgb, var(--cc) 85%, #fff) 236deg, #fff8dc 240deg,
      transparent 250deg, transparent 360deg);
    clip-path: polygon(evenodd,
      10.4% 3.4%, 89.6% 3.4%, 96.6% 10.4%, 96.6% 89.6%, 89.6% 96.6%, 10.4% 96.6%, 3.4% 89.6%, 3.4% 10.4%,
      11.1% 5%, 88.9% 5%, 95% 11.1%, 95% 88.9%, 88.9% 95%, 11.1% 95%, 5% 88.9%, 5% 11.1%);
    animation: meteor-run 4s linear infinite;
    filter: drop-shadow(0 0 3px color-mix(in srgb, var(--cc) 85%, transparent)); }

  /* glint = gương: vệt trắng mềm lóe qua, không màu, clip bát giác */
  .pcell .glint { position:absolute; inset:0; pointer-events:none; z-index:3; opacity:.65;
    clip-path: polygon(9% 0, 91% 0, 100% 9%, 100% 91%, 91% 100%, 9% 100%, 0 91%, 0 9%);
    background: linear-gradient(105deg, transparent 42%, rgba(255,255,255,.55) 50%, transparent 58%);
    background-size: 300% 300%; background-repeat:no-repeat;
    mix-blend-mode: screen;
    animation: glint-pass 5s ease-in-out infinite; }
  @keyframes glint-pass { 0% { background-position: 130% 130%; } 25%,100% { background-position: -30% -30%; } }
  /* pulse lan tỏa: ring octagon phóng-co từ khe */
  .pcell .ripple { position:absolute; inset:0; pointer-events:none; z-index:3;
    clip-path: polygon(evenodd,
      9% 0, 91% 0, 100% 9%, 100% 91%, 91% 100%, 9% 100%, 0 91%, 0 9%,
      10.4% 3.4%, 89.6% 3.4%, 96.6% 10.4%, 96.6% 89.6%, 89.6% 96.6%, 10.4% 96.6%, 3.4% 89.6%, 3.4% 10.4%);
    background: var(--cc,#ffd54f); opacity:0;
    animation: ripple-o 3s ease-out infinite; }
  @keyframes ripple-o { 0%{opacity:.5} 70%,100%{opacity:0} }

  /* ===== Cường hóa aura trên pcell: reuse .a1/.a2/.a3, màu --c theo cảnh ===== */
  .ch-p3{--c:var(--rc-3)} .ch-p6{--c:var(--rc-6)} .ch-p7{--c:var(--rc-7)}
  /* Phương án C: viền tĩnh màu PHẨM (mờ, luôn hiện) + sao băng = CHẤT chạy trên */
  .pcell.edge::after { content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
    background: color-mix(in srgb, var(--ec) 60%, transparent);
    clip-path: polygon(evenodd, 0 0, 100% 0, 100% 100%, 0 100%, 6% 6%, 94% 6%, 94% 94%, 6% 94%); }
  .pcell.edge.grad::after {
    background: linear-gradient(90deg, #fff6d8aa, #ffd66baa, #ff6b6baa, #9e8cffaa, #67d8ffaa, #fff6d8aa); }
  .pcell.edge::before { content:''; position:absolute; inset:0; z-index:2; pointer-events:none;
    background: conic-gradient(from var(--meteor),
      #ffd54f00 0deg, #ffd54f00 275deg, #ffe9a8cc 325deg, #fff8dc 342deg, #ffd54fee 355deg, #ffd54f00 360deg);
    clip-path: polygon(evenodd, 0 0, 100% 0, 100% 100%, 0 100%, 5% 5%, 95% 5%, 95% 95%, 5% 95%);
    animation: meteor-run 2.6s linear infinite; }
  .q1{--qc:var(--rc-1)} .q2{--qc:var(--rc-2)} .q3{--qc:var(--rc-3)} .q4{--qc:var(--rc-4)} .q5{--qc:var(--rc-5)}
  .q6{--qc:var(--rc-6)} .q7{--qc:var(--rc-7)} .q8{--qc:var(--rc-8)} .q9{--qc:#e02b2b} .q10{--qc:var(--grad-10)}
  /* giữ frame tĩnh mờ bên dưới để không mất viền khi vệt đi chỗ khác */
  .meteor-under::after {
    content:''; position:absolute; inset:0; z-index:0; pointer-events:none;
    background: linear-gradient(135deg, #e8c56a88, #7a5a2255 45%, #e8c56a88);
    clip-path: polygon(evenodd,
      9px 0, calc(100% - 9px) 0, 100% 9px, 100% calc(100% - 9px), calc(100% - 9px) 100%, 9px 100%, 0 calc(100% - 9px), 0 9px,
      11px 2px, calc(100% - 11px) 2px, calc(100% - 2px) 11px, calc(100% - 2px) calc(100% - 11px), calc(100% - 11px) calc(100% - 2px), 11px calc(100% - 2px), 2px calc(100% - 11px), 2px 11px);
  }
</style>
</head>
