# BETA-FINAL PR10 / spec B5 - protected beta candidate pipeline.
#
# Trigger: v<semver> tag push or manual dispatch naming an existing tag.
# Produces a signed Windows NSIS candidate, frozen SHA-256 manifest,
# checksums, CycloneDX SBOM and build provenance, then uploads to a DRAFT
# GitHub Release (the restricted candidate feed, EXT-04). It never publishes.
#
# Fail-closed by design - unresolved external inputs keep B5 unsealed rather
# than simulated:
#   EXT-02 signing identity   -> signing-preflight --require-signing blocks
#   EXT-03 protected env/vars -> `environment: beta-release` must exist with
#                                approval rules + secrets; backend vars gate
#                                the build
#   EXT-04 transport          -> token lives on this job only, never shipped
#
# Release concurrency serializes candidate builds so two runs can never race
# the same draft tag. Job permissions are minimal and scoped per job. Secrets
# are scoped per STEP (least privilege): npm ci, checkout and SBOM steps see
# no credential material, so dependency install scripts cannot exfiltrate the
# signing certificate or the upload token. No step dumps the environment or
# logs credential material.

name: beta-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'existing v<version> tag to release (must match package.json version)'
        required: true
        type: string

permissions: {}

concurrency:
  group: beta-release
  cancel-in-progress: false

env:
  NODE_VERSION: '22.23.3'
  RELEASE_CHANNEL: beta
  BACKEND_ENVIRONMENT: beta
  BUILD_ID: ${{ github.run_id }}-${{ github.run_number }}
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify-source:
    name: validate tag/identity + full verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout the exact tag/commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Tag push: github.sha is the tagged commit (exact SHA). Manual
          # dispatch: the named tag; validated below.
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record runner image identity
        run: |
          echo "runner.os=${{ runner.os }} runner.arch=${{ runner.arch }}"
          echo "ImageOS=${ImageOS:-unset} ImageVersion=${ImageVersion:-unset}"

      - name: Exact tag/SHA/version/dirty validation
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          [ -n "$TAG" ] || { echo "no release tag resolved"; exit 1; }
          case "$TAG" in v[0-9]*.*.*) ;; *) echo "tag must look like v<semver>: $TAG"; exit 1;; esac
          TAG_SHA="$(git rev-list -n1 "$TAG")"
          HEAD_SHA="$(git rev-parse HEAD)"
          [ "$TAG_SHA" = "$HEAD_SHA" ] || { echo "tag $TAG -> $TAG_SHA but HEAD is $HEAD_SHA"; exit 1; }
          DESCRIBED="$(git describe --tags --exact-match HEAD)"
          [ "$DESCRIBED" = "$TAG" ] || { echo "HEAD describes $DESCRIBED, not $TAG"; exit 1; }
          [ -z "$(git status --porcelain)" ] || { echo "dirty working tree - release requires clean input"; git status --short; exit 1; }
          VERSION="$(node -p "require('./game/package.json').version")"
          [ "$TAG" = "v$VERSION" ] || { echo "tag $TAG does not match package version v$VERSION"; exit 1; }
          echo "validated: tag=$TAG sha=$HEAD_SHA version=$VERSION clean=yes"

      - name: Setup Node (pinned)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: npm ci (lockfile-enforced)
        working-directory: game
        run: npm ci

      - name: canvas libuuid workaround (Linux)
        run: cp "$(readlink -f /lib/x86_64-linux-gnu/libuuid.so.1)" game/node_modules/canvas/build/Release/libuuid.so.1

      - name: Release-mode build identity gate
        # Validates release rules BEFORE any build output exists: semantic
        # version, matching v<version> tag, clean tree, CI build id,
        # non-development backend. Fails closed on mismatch.
        working-directory: game
        env:
          GIT_TAG: ${{ env.RELEASE_TAG }}
        run: node scripts/release/build-identity.mjs --json

      - name: npm run verify (type-check + build + full vitest)
        working-directory: game
        env:
          GIT_TAG: ${{ env.RELEASE_TAG }}
        run: npm run verify

      - name: Release script tests
        working-directory: game
        run: node --test "scripts/release/*.test.mjs"

  release:
    name: build, sign, manifest, draft upload (protected)
    needs: verify-source
    runs-on: windows-2022
    # EXT-03: the environment must exist with required reviewers so its
    # secrets (signing credentials, beta backend anon key) only materialize
    # after human approval. Until then this job blocks, honestly unsealed.
    environment: beta-release
    timeout-minutes: 90
    permissions:
      contents: write      # create draft release + upload assets
      id-token: write      # Sigstore build provenance attestation
      attestations: write  # upload attestations
    steps:
      - name: Checkout the exact tag/commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record runner image identity
        shell: pwsh
        run: |
          "runner.os=${{ runner.os }} runner.arch=${{ runner.arch }}"
          "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion"

      - name: Re-validate tag/SHA/dirty on this runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          if ([string]::IsNullOrEmpty($tag)) { throw 'no release tag resolved' }
          $tagSha = (git rev-list -n1 $tag).Trim()
          $head = (git rev-parse HEAD).Trim()
          if ($tagSha -ne $head) { throw "tag $tag -> $tagSha but HEAD is $head" }
          $described = (git describe --tags --exact-match HEAD).Trim()
          if ($described -ne $tag) { throw "HEAD describes $described, not $tag" }
          if (git status --porcelain) { throw 'dirty working tree' }
          $version = (node -p "require('./game/package.json').version").Trim()
          if ($tag -ne "v$version") { throw "tag $tag does not match package version v$version" }
          "validated: tag=$tag sha=$head version=$version clean=yes"

      - name: Setup Node (pinned)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: npm ci (lockfile-enforced)
        working-directory: game
        run: npm ci

      - name: Backend identity gate (EXT-03)
        # A beta candidate compiled without the beta backend wiring would
        # boot to the fatal-configuration screen - useless for QA, so it
        # blocks the release instead of shipping.
        shell: pwsh
        env:
          VITE_SUPABASE_URL: ${{ vars.BETA_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.BETA_SUPABASE_ANON_KEY }}
        run: |
          $missing = @()
          if ([string]::IsNullOrEmpty($env:VITE_SUPABASE_URL)) { $missing += 'BETA_SUPABASE_URL (vars)' }
          if ([string]::IsNullOrEmpty($env:VITE_SUPABASE_ANON_KEY)) { $missing += 'BETA_SUPABASE_ANON_KEY (secrets)' }
          if ($missing.Count -gt 0) {
            throw "beta backend env vars missing on the protected environment: $($missing -join ', ') - EXT-03 unresolved"
          }
          "backend identity: beta env vars present"

      - name: Signing preflight (fail-closed, EXT-02)
        working-directory: game
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run signing:preflight:release

      - name: Compile once + package + sign (electron-builder)
        # App binaries/helpers are signed during packaging; the NSIS
        # installer is assembled and signed last (electron-builder order).
        working-directory: game
        env:
          GIT_TAG: ${{ env.RELEASE_TAG }}
          VITE_SUPABASE_URL: ${{ vars.BETA_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.BETA_SUPABASE_ANON_KEY }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run dist:win

      - name: Verify Authenticode signatures
        working-directory: game
        shell: pwsh
        env:
          BETA_CERT_THUMBPRINT: ${{ vars.BETA_CERT_THUMBPRINT }}
        run: |
          if ($env:BETA_CERT_THUMBPRINT -notmatch '^[0-9A-Fa-f]{40}$') {
            throw 'BETA_CERT_THUMBPRINT var missing/malformed - EXT-02 record incomplete'
          }
          pwsh -NoProfile -File scripts/release/verify-signatures.ps1 `
            -ArtifactPath release `
            -ExpectedThumbprint $env:BETA_CERT_THUMBPRINT

      - name: Inspect packaged payload
        working-directory: game
        run: node scripts/release/inspect-package.mjs --input release

      - name: Generate CycloneDX SBOM
        working-directory: game
        shell: pwsh
        run: npm sbom --sbom-format cyclonedx | Out-File -Encoding utf8NoBOM -FilePath release/sbom.cdx.json

      - name: Generate manifest + checksums (after final signing)
        working-directory: game
        env:
          BETA_CERT_THUMBPRINT: ${{ vars.BETA_CERT_THUMBPRINT }}
        run: |
          node scripts/release/manifest.mjs `
            --input release `
            --tag "$env:RELEASE_TAG" `
            --signing-thumbprint "$env:BETA_CERT_THUMBPRINT"

      - name: Re-verify artifact hashes before upload
        working-directory: game
        run: node scripts/release/manifest.mjs --verify release/release-manifest.json --input release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: game/release/*

      - name: Upload draft candidate (idempotent, digest-verified)
        # Same-bytes retry -> unchanged; different bytes under the same tag
        # -> rejected; a published release for the tag -> blocked. The
        # production feed is never touched. The token exists only inside
        # this step - it is never baked into or shipped with the installer.
        working-directory: game
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release/publish-candidate.mjs `
            --manifest release/release-manifest.json `
            --input release `
            --verify-download
